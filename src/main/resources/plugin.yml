name: CustomWeapons
version: 1.1.0
main: dev.weapons.WeaponsPlugin
api-version: '26.2'
description: Custom weapons and tools with special abilities.
softdepend: [WorldGuard, Geyser-Spigot, LuckPerms]
commands:
  weapon:
    description: Give or manage the custom weapons
    usage: /weapon <give|list|reload|check|config>
    aliases: [cw, weapons]
permissions:
  customweapons.admin:
    description: Allows /weapon give, list, reload and check
    default: op
  customweapons.use:
    description: Allows using weapon abilities
    default: true
